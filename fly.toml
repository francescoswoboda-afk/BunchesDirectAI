# fly.toml app configuration file generated for bunches-direct on 2026-09-18T09:36:10+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bunches-direct'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  AVAILABILITY_DATA_DIR = '/data/availability'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'bunches_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
